<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Capture - Test Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0070ff 0%, #00a3ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #0070ff;
            box-shadow: 0 0 0 3px rgba(0, 112, 255, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .required {
            color: #e74c3c;
        }

        /* Honeypot field - HIDDEN from users, visible to bots */
        .honeypot {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0070ff 0%, #00a3ff 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 112, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .note {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #0070ff;
        }

        .note h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .note ul {
            list-style: none;
            padding-left: 0;
        }

        .note li {
            color: #666;
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
            font-size: 14px;
        }

        .note li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #0070ff;
            font-weight: bold;
        }

        .debug-info {
            margin-top: 20px;
            padding: 15px;
            background: #fffbeb;
            border: 1px solid #fbbf24;
            border-radius: 8px;
            font-size: 12px;
            color: #92400e;
        }

        .debug-info strong {
            color: #78350f;
        }

        /* Thank You Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.4s ease;
        }

        .modal-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounceIn 0.6s ease;
        }

        .modal-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .modal-message {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-button {
            padding: 12px 32px;
            background: linear-gradient(135deg, #0070ff 0%, #00a3ff 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .modal-button:hover {
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📬 Contact Us</h1>
        <p>Fill out the form below and we'll get back to you as soon as possible.</p>

        <form id="contact-form">
            <!-- Name -->
            <div class="form-group">
                <label for="name">
                    Full Name <span class="required">*</span>
                </label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">
                    Email Address <span class="required">*</span>
                </label>
                <input type="email" id="email" name="email" placeholder="john@example.com" required>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">
                    Phone Number
                </label>
                <input type="tel" id="phone" name="phone" placeholder="+1-555-0123">
            </div>

            <!-- Message -->
            <div class="form-group">
                <label for="message">
                    Message <span class="required">*</span>
                </label>
                <textarea id="message" name="message" placeholder="Tell us about your project or inquiry..."
                    required></textarea>
            </div>

            <!-- HONEYPOT FIELD - DO NOT REMOVE -->
            <!-- This is hidden from humans but will be filled by bots -->
            <div class="honeypot">
                <label for="website">Website (leave blank)</label>
                <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
            </div>

            <button type="submit">Send Message</button>
        </form>
    </div>

    <!-- Thank You Modal -->
    <div class="modal-overlay" id="thankYouModal">
        <div class="modal-content">
            <div class="modal-icon">✅</div>
            <h2 class="modal-title">Thank You!</h2>
            <p class="modal-message">
                Your message has been received successfully.<br>
                We'll get back to you as soon as possible.
            </p>
            <button class="modal-button" onclick="closeModal()">Close</button>
        </div>
    </div>

    <!-- 
    ============================================================================
    LEAD CAPTURE SCRIPT - CONFIGURATION
    ============================================================================
    
    BEFORE USING:
    1. Replace 'YOUR_WEBHOOK_URL' with your actual N8N webhook endpoint
    2. Replace 'YOUR_CUSTOMER_ID' with your unique customer identifier
    3. Set data-debug="true" for testing, "false" for production
    
    EXAMPLE:
    <script 
      src="./lead-capture.js"
      data-webhook-url="https://your-n8n-instance.com/webhook/leads"
      data-customer-id="acme-corp"
      data-honeypot-field="website"
      data-debug="true"
    ></script>
  -->
    <script src="./lead-capture.js" data-webhook-url="https://prathamoza.app.n8n.cloud/webhook-test/Leads"
        data-customer-id="pratham-portfolio" data-honeypot-field="website" data-debug="true"></script>

    <!-- Form Submission Handler -->
    <script>
        // Show modal function
        function showModal() {
            document.getElementById('thankYouModal').classList.add('show');
        }

        // Close modal function
        function closeModal() {
            document.getElementById('thankYouModal').classList.remove('show');
        }

        // Handle form submission
        document.getElementById('contact-form').addEventListener('submit', function (e) {
            // Prevent default form submission immediately
            e.preventDefault();

            // Let the lead capture script do its work first
            setTimeout(() => {
                // Show thank you modal
                showModal();
                // Reset form
                this.reset();
            }, 100);
        });

        // Close modal when clicking outside
        document.getElementById('thankYouModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>

</html>
